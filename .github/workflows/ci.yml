name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: tm, POSTGRES_PASSWORD: tm, POSTGRES_DB: typemaster_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://tm:tm@localhost:5432/typemaster_test
      DATABASE_URL: postgres://tm:tm@localhost:5432/typemaster_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply database migrations
        run: npm run migrate -w packages/db
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end + accessibility (Playwright, Google Chrome)
        run: npm run e2e -w apps/web
      - name: Lighthouse (performance, accessibility, best practices, SEO >= 90)
        run: npm run lighthouse -w apps/web
